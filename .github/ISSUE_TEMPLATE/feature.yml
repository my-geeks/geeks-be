name: Feature
description: 기능 개발 이슈를 생성합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 개발할 기능과 목적을 설명해주세요.
      placeholder: 어떤 기능을 개발하려고 하나요?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 필요한 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] API 설계
        - [ ] 기능 구현
        - [ ] 테스트 작성
    validations:
      required: true
