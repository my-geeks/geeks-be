name: Refactor
description: 리팩토링 이슈를 생성합니다.
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: description
    attributes:
      label: 리팩토링 설명
      description: 리팩토링이 필요한 대상과 이유를 설명해주세요.
      placeholder: 어떤 부분을 왜 개선하려고 하나요?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 필요한 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 구조 개선
        - [ ] 중복 제거
        - [ ] 테스트 확인
    validations:
      required: true
