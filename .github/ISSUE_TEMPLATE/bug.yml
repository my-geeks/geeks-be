name: Bug
description: 버그 수정 이슈를 생성합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발생한 문제를 설명해주세요.
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 발생 절차
      description: 문제가 발생하는 과정을 순서대로 작성해주세요.
      placeholder: |
        1. 로그인한다.
        2. 특정 페이지로 이동한다.
        3. 버튼을 클릭한다.
        4. 오류가 발생한다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 기대한 동작을 설명해주세요.
      placeholder: 어떤 동작이 정상이라고 기대했나요?
    validations:
      required: true
